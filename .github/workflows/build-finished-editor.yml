name: Build finished CC UI Editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        run: |
          python -m py_compile cc_terminal_ui_editor.pyw
          python -m py_compile cc_terminal_ui_editor_fixed.pyw

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Build executable
        run: pyinstaller --clean --noconfirm CC_Terminal_UI_Editor.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/CC_Terminal_UI_Editor.exe')) { throw 'Executable was not created' }
          Get-Item 'dist/CC_Terminal_UI_Editor.exe' | Format-List Name,Length,LastWriteTime

      - name: Commit executable
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/CC_Terminal_UI_Editor.exe
          if git diff --cached --quiet; then
            echo 'Executable is already up to date'
          else
            git commit -m 'Build Windows executable [skip ci]'
            git push origin HEAD:main
          fi
