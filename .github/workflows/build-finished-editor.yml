name: Build finished CC UI Editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: finish-device-support
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply finishing patch and README
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/finish-and-build.yml').read_text(encoding='utf-8')
          start = '      - name: Finish screen/device support\n        shell: python\n        run: |\n'
          end = '\n      - name: Syntax check'
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, 'finish-device-support', 'exec'))

      - name: Syntax check
        run: python -m py_compile cc_terminal_ui_editor.pyw

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Build executable
        run: pyinstaller --clean --noconfirm CC_Terminal_UI_Editor.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/CC_Terminal_UI_Editor.exe')) { throw 'Executable was not created' }
          Get-Item 'dist/CC_Terminal_UI_Editor.exe' | Format-List Name,Length,LastWriteTime

      - name: Commit result to working branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cc_terminal_ui_editor.pyw README.md dist/CC_Terminal_UI_Editor.exe
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Finish device support and build Windows executable [skip ci]'
            git push origin HEAD:finish-device-support
          fi
