name: Build finished CC UI Editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        run: |
          python -m py_compile cc_terminal_ui_editor.pyw
          python -m py_compile cc_terminal_ui_editor_fixed.pyw

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Build executable
        run: pyinstaller --clean --noconfirm CC_Terminal_UI_Editor.spec

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'dist/CC_Terminal_UI_Editor.exe'
          if (-not (Test-Path $exe)) { throw 'Executable was not created' }
          Get-Item $exe | Format-List Name,Length,LastWriteTime,VersionInfo

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/CC_Terminal_UI_Editor.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Executable exited during startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Sign executable when certificate is configured
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cc-ui-editor-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found' }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 'dist/CC_Terminal_UI_Editor.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Code signing failed' }
          Remove-Item $pfx -Force

      - name: Verify signature when certificate is configured
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'dist/CC_Terminal_UI_Editor.exe'
          $signature | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/CC_Terminal_UI_Editor.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CC_Terminal_UI_Editor.exe" | Set-Content -Encoding ascii 'dist/CC_Terminal_UI_Editor.exe.sha256'
          Get-Content 'dist/CC_Terminal_UI_Editor.exe.sha256'

      - name: Commit executable
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/CC_Terminal_UI_Editor.exe dist/CC_Terminal_UI_Editor.exe.sha256
          if git diff --cached --quiet; then
            echo 'Executable is already up to date'
          else
            git commit -m 'Build Windows executable [skip ci]'
            git push origin HEAD:main
          fi
